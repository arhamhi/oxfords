<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Today</title>
<style>
:root{
  --bg:#f6f3ee;--card:#fff;--ink:#1c1b19;--mute:#8a867e;--line:#ece8e1;
  --kcal:#ee6a3c;--p:#3f7d6b;--c:#e2a23b;--f:#6d7bd1;--over:#c8372d;
  --r:20px;
}
@media (prefers-color-scheme:dark){:root{--bg:#121110;--card:#1d1c1a;--ink:#f3f0ea;--mute:#8f8a80;--line:#2a2825}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{font:15px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:var(--ink);display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{position:relative;width:100%;max-width:390px;height:100%;max-height:844px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
@media(min-width:430px) and (min-height:860px){#app{border-radius:44px;margin:auto;box-shadow:0 0 0 1px var(--line),0 30px 80px #0003}}
.status{height:47px;flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 30px 6px;font-weight:600;font-size:15px}
.status svg{height:11px;fill:currentColor}
.scroll{flex:1;overflow-y:auto;padding:4px 16px 24px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
header{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 14px}
header h1{font-size:30px;letter-spacing:-.8px;font-weight:700}
header small{display:block;color:var(--mute);font-size:13px;font-weight:500;margin-bottom:2px}
.streak{display:flex;gap:5px;align-items:center;background:var(--card);border-radius:99px;padding:7px 12px 7px 9px;font-weight:600;font-size:13px;box-shadow:0 1px 0 var(--line)}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:0 1px 0 var(--line)}
.hero{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:164px;height:164px;flex:none}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring circle{fill:none;stroke-width:14;stroke-linecap:round}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--kcal);transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1),stroke .3s}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mid b{font-size:38px;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;line-height:1}
.mid span{font-size:12px;color:var(--mute);margin-top:4px;font-weight:500}
.side{flex:1;display:flex;flex-direction:column;gap:14px}
.side div span{display:block;font-size:12px;color:var(--mute);font-weight:500}
.side div b{font-size:20px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.m .top{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--mute);font-weight:500}
.m .val{font-size:17px;font-weight:650;margin:3px 0 7px;font-variant-numeric:tabular-nums}
.m .val i{font-style:normal;font-size:12px;color:var(--mute);font-weight:500}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bar u{display:block;height:100%;border-radius:9px;width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
h2{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin:24px 4px 10px;display:flex;justify-content:space-between}
.meal{margin-bottom:10px;padding:6px 16px}
.mh{display:flex;align-items:center;padding:10px 0;gap:10px}
.mh .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--bg)}
.mh .ic svg{width:17px;height:17px;stroke:var(--mute);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mh strong{flex:1;font-weight:600;font-size:16px}
.mh span{color:var(--mute);font-variant-numeric:tabular-nums;font-size:14px}
.mh .plus{width:30px;height:30px;border-radius:50%;background:var(--bg);color:var(--kcal);font-size:20px;line-height:1;display:grid;place-items:center}
.mh .plus:active{transform:scale(.9)}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left;animation:in .35s cubic-bezier(.2,.8,.2,1)}
.item .n{flex:1;min-width:0}
.item .n b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .n small{color:var(--mute);font-size:12.5px}
.item .k{font-variant-numeric:tabular-nums;font-weight:600}
.item .x{color:var(--mute);width:26px;height:26px;border-radius:50%;font-size:17px;opacity:.55}
.item .x:active{background:var(--bg)}
.empty{color:var(--mute);font-size:13.5px;padding:2px 0 12px;border-top:1px solid var(--line);padding-top:10px}
@keyframes in{from{opacity:0;transform:translateY(-6px)}}
.tabs{flex:none;display:flex;justify-content:space-around;align-items:flex-start;padding:8px 8px 0;height:84px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--mute);width:64px;padding-top:2px}
.tab svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--kcal)}
.fab{width:56px;height:56px;border-radius:50%;background:var(--kcal);color:#fff;display:grid;place-items:center;margin-top:-18px;box-shadow:0 8px 20px #ee6a3c66;transition:transform .15s}
.fab:active{transform:scale(.92)}
.fab svg{width:26px;height:26px;stroke:#fff;stroke-width:2.4}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:9px;background:var(--ink);opacity:.9;pointer-events:none;z-index:30}
/* sheet */
.scrim{position:absolute;inset:0;background:#0008;opacity:0;pointer-events:none;transition:opacity .3s;z-index:10}
.sheet{position:absolute;left:0;right:0;bottom:0;height:88%;background:var(--bg);border-radius:28px 28px 0 0;transform:translateY(100%);transition:transform .42s cubic-bezier(.2,.9,.2,1);z-index:20;display:flex;flex-direction:column;padding-top:8px}
.open .scrim{opacity:1;pointer-events:auto}
.open .sheet{transform:none}
.grab{width:38px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sh{display:flex;align-items:center;justify-content:space-between;padding:0 18px 10px}
.sh h3{font-size:20px;letter-spacing:-.4px}
.sh button{color:var(--kcal);font-weight:600}
.search{margin:0 16px;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:0 12px;height:44px;box-shadow:0 1px 0 var(--line)}
.search svg{width:18px;height:18px;stroke:var(--mute);fill:none;stroke-width:2;stroke-linecap:round}
.search input{flex:1;border:0;outline:0;background:none;font:inherit;font-size:16px;color:var(--ink);min-width:0}
.chips{display:flex;gap:8px;padding:12px 16px 4px;overflow-x:auto;scrollbar-width:none;flex:none}
.chip{flex:none;padding:7px 13px;border-radius:99px;background:var(--card);font-weight:500;font-size:14px;box-shadow:0 1px 0 var(--line)}
.chip.on{background:var(--ink);color:var(--bg)}
.list{flex:1;overflow-y:auto;padding:6px 16px 20px;scrollbar-width:none}
.food{display:flex;width:100%;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);text-align:left}
.food .n{flex:1}.food .n b{display:block;font-weight:500}.food .n small{color:var(--mute);font-size:12.5px}
.food .k{font-weight:600;font-variant-numeric:tabular-nums}
.food .a{width:30px;height:30px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--kcal);font-size:19px}
.food:active{background:var(--card)}
.none{color:var(--mute);text-align:center;padding:22px 0 8px}
.custom{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.custom label{font-size:11px;color:var(--mute);font-weight:600}
.custom input{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px;padding:0 10px;margin-top:3px}
.btn{display:block;width:100%;height:52px;border-radius:16px;background:var(--kcal);color:#fff;font-weight:650;font-size:17px;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4}
/* detail */
.detail{position:absolute;inset:0;background:var(--bg);border-radius:28px 28px 0 0;transform:translateX(100%);transition:transform .38s cubic-bezier(.2,.9,.2,1);display:flex;flex-direction:column;padding:8px 18px 34px}
.det .detail{transform:none}
.back{color:var(--kcal);font-weight:600;text-align:left;padding:4px 0 12px}
.detail h3{font-size:26px;letter-spacing:-.7px}
.detail .sv{color:var(--mute);margin:2px 0 18px}
.stepper{display:flex;align-items:center;justify-content:space-between;margin:16px 0}
.stepper button{width:48px;height:48px;border-radius:50%;background:var(--card);font-size:24px;box-shadow:0 1px 0 var(--line)}
.stepper button:active{transform:scale(.92)}
.stepper div{text-align:center}.stepper b{font-size:32px;letter-spacing:-1px}.stepper small{display:block;color:var(--mute);font-size:12px}
.dm{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:6px}
.dm b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.dm small{color:var(--mute);font-size:12px}
.sel{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 auto}
.sel .chip{text-align:center;padding:10px 0}
.toast{position:absolute;left:50%;top:58px;transform:translate(-50%,-80px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;z-index:40;transition:transform .4s cubic-bezier(.2,.9,.2,1);white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
.stub{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;color:var(--mute);gap:6px}
.stub b{color:var(--ink);font-size:20px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="status"><span id="clock">9:41</span>
    <svg viewBox="0 0 66 11" aria-hidden="true"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="6" rx="1"/><rect x="10" y="2.5" width="3" height="8.5" rx="1"/><rect x="15" y="0" width="3" height="11" rx="1"/><path d="M28 3a8 8 0 0 1 10 0l-1.3 1.5a6 6 0 0 0-7.4 0zM30.5 6a4.5 4.5 0 0 1 5 0L33 9z"/><rect x="45" y=".5" width="19" height="10" rx="3" fill="none" stroke="currentColor" opacity=".5"/><rect x="46.5" y="2" width="14" height="7" rx="1.8"/></svg>
  </div>

  <div class="scroll" id="today">
    <header><div><small id="date"></small><h1>Today</h1></div>
      <div class="streak"><svg width="16" height="16" viewBox="0 0 24 24" fill="#ee6a3c"><path d="M12 2s5 4.5 5 9.5a5 5 0 0 1-10 0c0-1.5.5-2.5 1.2-3.5C8.5 9.500 10 10 10 10s-1-4 2-8z"/></svg>12 day streak</div></header>

    <section class="card">
      <div class="hero">
        <div class="ring"><svg viewBox="0 0 164 164"><circle class="bg" cx="82" cy="82" r="72"/><circle class="fg" id="fg" cx="82" cy="82" r="72"/></svg>
          <div class="mid"><b id="rem">0</b><span id="remL">kcal left</span></div></div>
        <div class="side">
          <div><span>Eaten</span><b id="eaten">0</b></div>
          <div><span>Goal</span><b id="goal">2,200</b></div>
          <div><span>Meals</span><b id="cnt">0</b></div>
        </div>
      </div>
      <div class="macros" id="macros"></div>
    </section>

    <h2>Meals</h2>
    <div id="meals"></div>
  </div>

  <div class="stub" id="stub"><b id="stubT"></b><span>Mockup placeholder</span></div>

  <nav class="tabs">
    <button class="tab on" data-t="Today"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Today</button>
    <button class="tab" data-t="Diary"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h4"/></svg>Diary</button>
    <button class="fab" id="fab" aria-label="Add food"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tab" data-t="Trends"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l4-5 3 3 5-6"/></svg>Trends</button>
    <button class="tab" data-t="Me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 4-6 8-6s7 2 8 6"/></svg>Me</button>
  </nav>
  <div class="home"></div>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet">
    <div class="grab"></div>
    <div class="sh"><h3 id="shT">Add food</h3><button id="close">Cancel</button></div>
    <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="Search foods" autocomplete="off" enterkeyhint="search"></label>
    <div class="chips" id="mealChips"></div>
    <div class="list" id="list"></div>
    <div class="detail" id="detail">
      <button class="back" id="back">‹ Back</button>
      <h3 id="dN"></h3><div class="sv" id="dS"></div>
      <div class="dm" id="dM"></div>
      <div class="stepper"><button id="minus" aria-label="Less">−</button><div><b id="qty">1</b><small>servings</small></div><button id="plus" aria-label="More">+</button></div>
      <div class="sel" id="dSel"></div>
      <button class="btn" id="addBtn"></button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const GOAL=2200,MG={p:150,c:240,f:70};
const MEALS=[["Breakfast","M4 14h13a3 3 0 0 0 0-6h-1M4 14a6 6 0 0 0 6 6h1a6 6 0 0 0 6-6M8 3v2M12 3v2"],["Lunch","M12 3v9M8 3v5a4 4 0 0 0 8 0V3M12 12v9"],["Dinner","M4 13h16a8 8 0 0 1-16 0zM12 5v3"],["Snacks","M12 7c-3-3-8 0-6 5 1 3 3 7 6 7s5-4 6-7c2-5-3-8-6-5zM12 7c0-2 1-3 3-4"]];
const FOODS=[
["Oatmeal with banana","1 bowl",310,9,56,6],["Greek yogurt, plain","170 g",100,17,6,1],["Scrambled eggs","2 eggs",190,13,2,14],["Avocado toast","1 slice",260,7,26,15],
["Grilled chicken breast","150 g",248,46,0,5],["Chicken burrito bowl","1 bowl",620,42,64,20],["Salmon fillet","150 g",312,34,0,19],["Brown rice","1 cup",216,5,45,2],
["Caesar salad","1 plate",330,12,14,26],["Beef burger","1 burger",540,30,40,28],["Spaghetti bolognese","1 plate",580,28,70,19],["Lentil soup","1 bowl",230,15,38,3],
["Banana","1 medium",105,1,27,0],["Apple","1 medium",95,0,25,0],["Almonds","28 g",164,6,6,14],["Protein shake","1 scoop",130,25,4,2],
["Peanut butter","2 tbsp",190,8,7,16],["Cottage cheese","1 cup",220,25,8,10],["Latte","12 oz",150,8,12,6],["Dark chocolate","30 g",170,2,13,12]
].map((a,i)=>({id:i,n:a[0],s:a[1],k:a[2],p:a[3],c:a[4],f:a[5]}));
const hr=new Date().getHours();
const defMeal=hr<11?0:hr<15?1:hr<20?2:3;
const key="cal-mock-"+new Date().toDateString();
let log;
try{log=JSON.parse(localStorage.getItem(key))}catch(e){}
if(!Array.isArray(log))log=[[0,0,1],[0,1,1],[1,4,1]].map(([m,i,q],j)=>({id:j,m,food:FOODS[i],q}));
let nid=100,meal=defMeal,cur=null,qty=1;
const fmt=n=>Math.round(n).toLocaleString("en-US");
const save=()=>{try{localStorage.setItem(key,JSON.stringify(log))}catch(e){}};
const tot=l=>l.reduce((a,e)=>({k:a.k+e.food.k*e.q,p:a.p+e.food.p*e.q,c:a.c+e.food.c*e.q,f:a.f+e.food.f*e.q}),{k:0,p:0,c:0,f:0});

function render(){
  const t=tot(log),C=2*Math.PI*72,left=GOAL-t.k,over=left<0;
  $("#fg").style.strokeDasharray=C;
  $("#fg").style.strokeDashoffset=C*(1-Math.min(t.k/GOAL,1));
  $("#fg").style.stroke=over?"var(--over)":"var(--kcal)";
  $("#rem").textContent=fmt(Math.abs(left));
  $("#remL").textContent=over?"kcal over":"kcal left";
  $("#eaten").textContent=fmt(t.k);$("#goal").textContent=fmt(GOAL);$("#cnt").textContent=log.length+" items";
  $("#macros").innerHTML=[["Protein","p","var(--p)"],["Carbs","c","var(--c)"],["Fat","f","var(--f)"]].map(([l,k,c])=>
   `<div class="m"><div class="top">${l}</div><div class="val">${fmt(t[k])}<i> / ${MG[k]}g</i></div><div class="bar"><u style="background:${c};width:${Math.min(100,t[k]/MG[k]*100)}%"></u></div></div>`).join("");
  $("#meals").innerHTML=MEALS.map(([name,ic],mi)=>{
    const es=log.filter(e=>e.m===mi),k=tot(es).k;
    return `<div class="card meal"><div class="mh"><div class="ic"><svg viewBox="0 0 24 24"><path d="${ic}"/></svg></div><strong>${name}</strong><span>${k?fmt(k)+" kcal":""}</span><button class="plus" data-add="${mi}" aria-label="Add to ${name}">+</button></div>`+
    (es.length?es.map(e=>`<div class="item"><div class="n"><b>${e.food.n}</b><small>${e.q===1?e.food.s:e.q+" × "+e.food.s} · ${fmt(e.food.p*e.q)}P ${fmt(e.food.c*e.q)}C ${fmt(e.food.f*e.q)}F</small></div><span class="k">${fmt(e.food.k*e.q)}</span><button class="x" data-del="${e.id}" aria-label="Remove ${e.food.n}">×</button></div>`).join(""):`<div class="empty">Nothing logged yet</div>`)+`</div>`;
  }).join("");
}

function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove("show"),1800)}

function openSheet(m){meal=m;$("#app").classList.add("open");$("#app").classList.remove("det");$("#q").value="";chips();list();}
function closeSheet(){$("#app").classList.remove("open","det");$("#q").blur()}
function chips(){const h=MEALS.map(([n],i)=>`<button class="chip${i===meal?" on":""}" data-m="${i}">${n}</button>`).join("");$("#mealChips").innerHTML=h;$("#dSel").innerHTML=h}
function list(){
  const q=$("#q").value.trim().toLowerCase();
  const r=FOODS.filter(f=>f.n.toLowerCase().includes(q));
  $("#list").innerHTML=r.length?r.map(f=>`<button class="food" data-f="${f.id}"><div class="n"><b>${f.n}</b><small>${f.s} · ${f.p}P ${f.c}C ${f.f}F</small></div><span class="k">${f.k}</span><span class="a">+</span></button>`).join(""):
  `<div class="none">No match for “${q.replace(/</g,"&lt;")}”.<br>Add it yourself:</div><div class="custom"><div><label>KCAL</label><input id="ck" type="number" inputmode="numeric"></div><div><label>PROTEIN</label><input id="cp" type="number" inputmode="numeric"></div><div><label>CARBS</label><input id="cc" type="number" inputmode="numeric"></div><div><label>FAT</label><input id="cf" type="number" inputmode="numeric"></div></div><button class="btn" id="cadd" style="margin-top:14px">Add custom food</button>`;
}
function openDetail(f){cur=f;qty=1;$("#dN").textContent=f.n;$("#dS").textContent="per "+f.s;chips();$("#app").classList.add("det");$("#q").blur();upd()}
function upd(){
  const f=cur;
  $("#qty").textContent=qty;
  $("#dM").innerHTML=[["kcal",f.k],["Protein",f.p],["Carbs",f.c],["Fat",f.f]].map(([l,v])=>`<div><b>${fmt(v*qty)}${l==="kcal"?"":"g"}</b><small>${l}</small></div>`).join("");
  $("#addBtn").textContent=`Add ${fmt(f.k*qty)} kcal to ${MEALS[meal][0]}`;
}
function add(food,q){
  log.push({id:nid++,m:meal,food,q});save();render();closeSheet();
  toast(`Added ${food.n} · +${fmt(food.k*q)} kcal`);
  $("#today").scrollTo({top:0,behavior:"smooth"});
}

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.id==="fab")openSheet(defMeal);
  else if(t.dataset.add)openSheet(+t.dataset.add);
  else if(t.dataset.del){const x=log.find(i=>i.id==t.dataset.del);log=log.filter(i=>i!==x);save();render();toast(`Removed ${x.food.n}`)}
  else if(t.id==="close")closeSheet();
  else if(t.id==="back")$("#app").classList.remove("det");
  else if(t.dataset.m){meal=+t.dataset.m;chips();if(cur)upd()}
  else if(t.dataset.f)openDetail(FOODS[t.dataset.f]);
  else if(t.id==="minus"){qty=Math.max(.5,qty-.5);upd()}
  else if(t.id==="plus"){qty=Math.min(10,qty+.5);upd()}
  else if(t.id==="addBtn")add(cur,qty);
  else if(t.id==="cadd"){
    const v=i=>Math.max(0,+$(i).value||0),k=v("#ck");
    if(!k){$("#ck").focus();return}
    add({n:$("#q").value.trim()||"Custom food",s:"1 serving",k,p:v("#cp"),c:v("#cc"),f:v("#cf")},1);
  }
  else if(t.dataset.t){
    document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b===t));
    const home=t.dataset.t==="Today";
    $("#today").style.display=home?"":"none";$("#stub").style.display=home?"none":"flex";$("#stubT").textContent=t.dataset.t;
  }
});
$("#scrim").onclick=closeSheet;
$("#q").addEventListener("input",list);
const d=new Date();
$("#date").textContent=d.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
$("#clock").textContent=d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}).replace(/ ?[AP]M/,"");
render();
</script>
</body>
</html>
