<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billing</title>
<!-- oxfords fixture: one known instance of each defect shoot.mjs must find. No dark theme. -->
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #fff; color: #1a1a1a; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
  section { margin: 0 0 32px; }

  /* 1. low-contrast text */
  .faint { color: #b0b0b0; }

  /* 2. low-contrast text over a gradient */
  .hero { background: linear-gradient(90deg, #f4f4f4, #dcdcdc); padding: 32px 16px; }
  .hero p { color: #b8b8b8; margin: 0; }

  /* 3. a heading clipped to one line */
  .card h2 { width: 220px; height: 1.3em; overflow: hidden; font-size: 20px; line-height: 1.3; margin: 0; }

  /* 4. a fixed-width row wider than a phone */
  .plans { width: 560px; display: flex; gap: 16px; }
  .plans div { flex: 1; border: 1px solid #ccc; padding: 8px; }

  /* 5. a label pulled up into the number above it */
  .stat .num { display: block; font-size: 32px; line-height: 1; }
  .stat .unit { display: block; margin: -22px 0 0 8px; }

  /* 6. 20px icon buttons, packed together; the second has no name */
  .tools { display: flex; gap: 2px; }
  .tools button { width: 20px; height: 20px; padding: 0; border: 1px solid #555; background: #fff; color: #1a1a1a; }

  /* 7. outline removed, nothing put back */
  .save { outline: none; font: inherit; padding: 10px 16px; border: 1px solid #1a1a1a; background: #fff; color: #1a1a1a; }

  /* 8. waits for a script event that never comes */
  .reveal { opacity: 0; }

  /* 9. six saturated hues */
  .swatches { display: grid; grid-template-columns: repeat(6, 1fr); }
  .swatches div { height: 120px; }

  /* 10. a skip link that stays parked off-screen when focused */
  .skip { position: absolute; left: -9999px; }

  /* 11. a focusable chart bar with no focus style and nothing drawn by script */
  .bar { fill: #1a1a1a; }
  .bar:focus { outline: none; }

  /* 12. a 20px control made clickable from script, packed next to the buttons */
  .tools .chip { box-sizing: border-box; width: 20px; height: 20px; border: 1px solid #555; }

  /* bonus: a field whose edge disappears */
  .pale { border: 1px solid #eee; background: #fff; font: inherit; padding: 10px; }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<main id="main">
  <section>
    <h1>Billing</h1>
    <p class="faint">Next invoice</p>
  </section>

  <section class="hero">
    <p>Plain numbers, every month</p>
  </section>

  <section class="card">
    <h2>Quarterly usage across every connected workspace</h2>
    <p>Updated on the first of each month.</p>
  </section>

  <section class="plans">
    <div>Starter 12 seats</div><div>Team 40 seats</div><div>Studio 120 seats</div>
  </section>

  <section class="stat">
    <span class="num">12,480</span>
    <span class="unit">orders this quarter</span>
  </section>

  <section class="tools">
    <button aria-label="Bold"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2h8v8H2z" fill="currentColor"/></svg></button>
    <button><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8" stroke="currentColor" stroke-width="2"/></svg></button>
    <div class="chip" title="Strike"></div>
  </section>

  <section>
    <svg width="120" height="80" role="group" aria-label="Orders by day">
      <rect class="bar" x="10" y="20" width="40" height="60" tabindex="0" role="img" aria-label="Monday: 48 orders"/>
    </svg>
  </section>

  <section>
    <label for="email">Billing email</label><br>
    <input id="email" class="pale" type="email" value="ops@tallyhouse.co">
    <button class="save">Save draft</button>
  </section>

  <section class="reveal">
    <h2>Payment history</h2>
    <p>Fourteen payments since March.</p>
  </section>

  <section class="swatches" aria-hidden="true">
    <div style="background:#d93a3a"></div><div style="background:#e8833a"></div><div style="background:#e6c229"></div>
    <div style="background:#3a9d5d"></div><div style="background:#3a6fd9"></div><div style="background:#9b3ad9"></div>
  </section>
</main>
<script>
  // The reveal never happens: nothing dispatches this event.
  window.addEventListener('app:ready', () => { document.querySelector('.reveal').style.opacity = 1; });
  // Clickable, but only through a script property: no role, no tabindex, no onclick attribute.
  document.querySelector('.chip').onclick = () => {};
</script>
</body>
</html>
